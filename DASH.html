<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>판매 현황 - 용용이네 & 밧디글라</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  :root { --cream: #fdf7ea; --green-dk: #4f9a25; --orange: #f4923a; --orange-dk: #c9711f; --brown: #2b1d12; --muted: #8a7a62; --line: #eadfc8; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background: var(--cream);
    background-image: radial-gradient(#e9dfc6 1.2px, transparent 1.2px); background-size: 18px 18px; color: var(--brown); }
  .wrap { max-width: 520px; margin: 0 auto; padding: 32px 16px 48px; }
  .jua { font-family: 'Jua', 'Noto Sans KR', sans-serif; font-weight: 400; }
  h1 { margin: 0; font-size: 30px; color: var(--green-dk); }
  h2 { margin: 28px 0 12px; font-size: 20px; color: var(--green-dk); }
  #status { margin: 4px 0 0; font-size: 14px; color: var(--muted); }
  .card { background: #fff; border-radius: 22px; padding: 18px 20px; box-shadow: 0 5px 0 var(--line); margin-top: 16px; }
  .card h3 { margin: 0 0 12px; font-size: 18px; }
  .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .tiles div { display: flex; flex-direction: column; gap: 2px; }
  .tiles span { font-size: 14px; color: var(--muted); }
  .tiles b { font-size: 32px; line-height: 1.2; }
  .tiles b.sm { font-size: 22px; }
  .tiles b.none { font-size: 20px; color: var(--muted); }
  .tiles small { font-size: 13px; color: var(--muted); }
  .days { list-style: none; margin: 0; padding: 0; }
  .days li { padding: 10px 0; border-top: 1px solid #f2ecdf; }
  .days li:first-child { border-top: 0; padding-top: 0; }
  .days .top { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; margin-bottom: 6px; }
  .days .top span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
  .days em { font-style: normal; font-size: 12px; padding: 1px 6px; border-radius: 999px; background: #eaf6df; color: var(--green-dk); margin-left: 4px; }
  /* 막대 길이 = 그날 박스 수 / 가장 많이 팔린 날 */
  .bar { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; }
  .bar i { height: 14px; width: calc((100% - 72px) * var(--p)); min-width: 4px; background: var(--green-dk); border-radius: 0 4px 4px 0; }
  .empty { color: var(--muted); font-size: 15px; margin: 0; }
</style>
</head>
<body>
<main class="wrap">
  <h1 class="jua">판매 현황</h1>
  <p id="status">불러오는 중…</p>
  <div id="items"></div>
  <div id="summary"></div>
  <h2 class="jua">일자별 주문</h2>
  <div class="card"><ol class="days" id="days"><li class="empty">불러오는 중…</li></ol></div>
</main>

<script>
// 주문 폼(index.html)과 같은 Apps Script 주소. doGet이 이름·연락처 없이 숫자만 돌려줌
const API_URL = "https://script.google.com/macros/s/AKfycbxp5WRsN4Fp7ckoolRQMujKjvYyS2Tcv097gAmzfzJeaApfny6n_UJqAOIBNKVbQNuv/exec";

const $ = id => document.getElementById(id);
const won = n => n.toLocaleString("ko-KR") + "원";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const today = new Date().toLocaleDateString("sv-SE", { timeZone: "Asia/Seoul" });   // yyyy-MM-dd (시트 집계와 같은 한국 날짜)
const dayLabel = s => { const d = new Date(s + "T00:00:00"); return `${d.getMonth() + 1}.${d.getDate()} (${"일월화수목금토"[d.getDay()]})`; };

fetch(API_URL).then(r => r.json()).then(({ items, days }) => {
  $("status").textContent = new Date().toLocaleString("ko-KR", { month: "long", day: "numeric", hour: "2-digit", minute: "2-digit" }) + " 기준";

  // 품목별: 남은 박스(재고 탭 '총 판매 수량' − 판매한 박스) · 판매한 박스. 총 판매 수량을 입력한 품목이 위로
  items.sort((a, b) => (b.left !== null) - (a.left !== null));
  $("items").innerHTML = items.map(it => `
    <section class="card">
      <h3 class="jua">${esc(it.name)}</h3>
      <div class="tiles">
        <div><span>남은 박스</span>${it.left === null ? `<b class="none">미입력</b><small>시트 '재고' 탭에 총 판매 수량 입력</small>` : `<b>${it.left.toLocaleString()}</b><small>총 ${it.total.toLocaleString()}박스 중</small>`}</div>
        <div><span>판매한 박스</span><b>${it.sold.toLocaleString()}</b><small>입금 확인 ${it.paid.toLocaleString()}박스</small></div>
      </div>
    </section>`).join("");

  const t = days.find(d => d.date === today) || { orders: 0, boxes: 0 };
  const sum = k => days.reduce((s, d) => s + d[k], 0);
  $("summary").innerHTML = `
    <section class="card"><div class="tiles">
      <div><span>오늘 주문</span><b class="sm">${t.orders}건 · ${t.boxes}박스</b></div>
      <div><span>누적 매출</span><b class="sm">${won(sum("total"))}</b><small>총 ${sum("orders").toLocaleString()}건</small></div>
    </div></section>`;

  const max = Math.max(1, ...days.map(d => d.boxes));
  $("days").innerHTML = days.length ? days.map(d => `
    <li>
      <div class="top"><span>${dayLabel(d.date)}${d.date === today ? "<em>오늘</em>" : ""}</span><span>${d.orders}건 · ${won(d.total)}</span></div>
      <div class="bar"><i style="--p:${d.boxes / max}"></i>${d.boxes}박스</div>
    </li>`).join("") : `<li class="empty">아직 주문이 없어요</li>`;
}).catch(() => {
  $("status").textContent = "불러오지 못했어요. 잠시 후 새로고침해 주세요.";
  $("days").innerHTML = "";
});
</script>
</body>
</html>
